<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nebenkosten</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nebenkosten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --text:#16202a; --muted:#64707d; --line:#e3e7ec;
  --accent:#0f766e; --accent-soft:#e6f4f2; --good:#15803d; --good-soft:#e8f6ec; --bad:#c2410c; --bad-soft:#fdeee6;
  --strom:#d97706; --gas:#dc2626; --wasser:#2563eb;
  --radius:16px; --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0e1316; --card:#182026; --text:#e8edf1; --muted:#93a0ab; --line:#2a343c;
    --accent:#2dd4bf; --accent-soft:#12302d; --good:#4ade80; --good-soft:#123020; --bad:#fb923c; --bad-soft:#3a2214;
    --strom:#fbbf24; --gas:#f87171; --wasser:#60a5fa; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(var(--safe-t) + 12px) 18px 10px}
header h1{margin:0;font-size:28px;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
main{padding:4px 14px calc(96px + var(--safe-b));max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h2{margin:0 0 10px;font-size:17px}
.card h3{margin:14px 0 6px;font-size:15px;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:13px}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--accent-soft);color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat .l{font-size:12px;color:var(--muted)}.stat .v{font-size:18px;font-weight:650}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 4px;position:relative}
.bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.mtype{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:none}
.t-strom{background:color-mix(in srgb,var(--strom) 18%,transparent)}.t-gas{background:color-mix(in srgb,var(--gas) 18%,transparent)}.t-wasser{background:color-mix(in srgb,var(--wasser) 18%,transparent)}
.banner{background:var(--accent-soft);color:var(--text);border-radius:var(--radius);padding:12px 14px;margin:0 0 12px;display:flex;gap:10px;align-items:center}
.banner b{color:var(--accent)}
button,.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
@media (prefers-color-scheme:dark){button,.btn{color:#04201d}}
button.secondary,.btn.secondary{background:var(--accent-soft);color:var(--accent)}
button.ghost{background:transparent;color:var(--accent);padding:8px 10px}
button.danger{background:var(--bad-soft);color:var(--bad)}
button.block{width:100%}
button:disabled{opacity:.5}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow>*{flex:1}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;background:transparent;color:var(--text);padding:8px 10px;border-radius:9px;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
nav button{flex:1;flex-direction:column;gap:2px;background:transparent;color:var(--muted);font-size:11px;font-weight:600;padding:6px 2px;border-radius:10px}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
.list>div{padding:12px 0;border-bottom:1px solid var(--line)}.list>div:last-child{border-bottom:0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + var(--safe-b));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h2{margin:0 0 6px}
.cropwrap{position:relative;touch-action:none;border-radius:12px;overflow:hidden;background:#000;margin-top:10px}
.cropwrap canvas{display:block;width:100%;height:auto}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;font-weight:600;max-width:90vw}
.spinner{width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{text-align:center;padding:26px 10px}
.empty .e{font-size:42px}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;margin-top:8px}
pre.raw{white-space:pre-wrap;font-size:12px;max-height:180px;overflow:auto;background:var(--bg);padding:8px;border-radius:8px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.warn{color:var(--bad);font-size:13px;margin-top:6px;font-weight:600}
</style>
</head>
<body>
<header><h1 id="title">Übersicht</h1><p id="subtitle"></p></header>
<main id="view"></main>
<nav id="nav">
  <button data-v="dash" class="on"><span class="i">🏠</span>Übersicht</button>
  <button data-v="read"><span class="i">📷</span>Ablesen</button>
  <button data-v="bills"><span class="i">🧾</span>Rechnungen</button>
  <button data-v="stats"><span class="i">📊</span>Statistik</button>
  <button data-v="settings"><span class="i">⚙️</span>Mehr</button>
</nav>
<script src="app.js"></script>
</body>
</html>
